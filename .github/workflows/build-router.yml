name: docker-build

on:
  workflow_dispatch:
    inputs:
      docker_tag:
        description: Docker image tag to publish
        default: latest
        required: true
      version_feature_set:
        description: Value for the VERSION_FEATURE_SET build arg
        default: v1
        required: true
      extra_features:
        description: Additional cargo feature flags (empty string keeps default)
        default: ""
        required: false
      runner:
        description: GitHub-hosted runner label (pick a larger runner as needed)
        default: ubuntu-latest
        required: true
      router_image:
        description: Docker Hub image name for the router (fallback to repository variables)
        default: "mithras-hyper-router"
        required: false
      scheduler_image:
        description: Docker Hub image name for the scheduler (fallback to repository variables)
        default: "mithras-hyper-scheduler"
        required: false
      drainer_image:
        description: Docker Hub image name for the drainer (fallback to repository variables)
        default: "mithras-hyper-drainer"
        required: false
      docker_namespace:
        description: Docker Hub namespace/organization to prepend when image names omit it
        default: "lucasdpxsol"
        required: false
  push:
    tags:
      - "v*"
      - "release-*"
  release:
    types:
      - published

jobs:
  registry_access:
    name: Validate Docker registry credentials
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Ensure Docker Hub secrets present
        shell: bash
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN secrets are missing."
            exit 1
          fi

      - name: Resolve image names
        shell: bash
        env:
          INPUT_ROUTER_IMAGE: ${{ inputs.router_image }}
          INPUT_SCHEDULER_IMAGE: ${{ inputs.scheduler_image }}
          INPUT_DRAINER_IMAGE: ${{ inputs.drainer_image }}
          VAR_ROUTER_IMAGE: ${{ vars.ROUTER_IMAGE_NAME }}
          VAR_SCHEDULER_IMAGE: ${{ vars.SCHEDULER_IMAGE_NAME }}
          VAR_DRAINER_IMAGE: ${{ vars.DRAINER_IMAGE_NAME }}
          VAR_IMAGE: ${{ vars.IMAGE_NAME }}
          NAMESPACE: ${{ inputs.docker_namespace || vars.DOCKER_NAMESPACE || 'lucasdpxsol' }}
        run: |
          resolve_image() {
            local candidate="$1"
            local namespace="$2"
            if [ -n "$candidate" ]; then
              if [[ "$candidate" == */* ]]; then
                printf '%s' "$candidate"
              else
                printf '%s/%s' "$namespace" "$candidate"
              fi
              return 0
            fi
            return 1
          }

          pick_image() {
            local explicit="$1"
            local scoped_var="$2"
            local shared_var="$3"
            local default_repo="$4"
            local namespace="$5"
            local value=""

            value=$(resolve_image "$explicit" "$namespace") && { printf '%s' "$value"; return; }
            value=$(resolve_image "$scoped_var" "$namespace") && { printf '%s' "$value"; return; }
            value=$(resolve_image "$shared_var" "$namespace") && { printf '%s' "$value"; return; }
            printf '%s/%s' "$namespace" "$default_repo"
          }

          ROUTER_IMAGE=$(pick_image "$INPUT_ROUTER_IMAGE" "$VAR_ROUTER_IMAGE" "$VAR_IMAGE" "mithras-hyper-router" "$NAMESPACE")
          SCHEDULER_IMAGE=$(pick_image "$INPUT_SCHEDULER_IMAGE" "$VAR_SCHEDULER_IMAGE" "$VAR_IMAGE" "mithras-hyper-scheduler" "$NAMESPACE")
          DRAINER_IMAGE=$(pick_image "$INPUT_DRAINER_IMAGE" "$VAR_DRAINER_IMAGE" "$VAR_IMAGE" "mithras-hyper-drainer" "$NAMESPACE")

          printf 'ROUTER_IMAGE=%s\n' "$ROUTER_IMAGE" >> "$GITHUB_ENV"
          printf 'SCHEDULER_IMAGE=%s\n' "$SCHEDULER_IMAGE" >> "$GITHUB_ENV"
          printf 'DRAINER_IMAGE=%s\n' "$DRAINER_IMAGE" >> "$GITHUB_ENV"

          echo "Resolved images:"
          echo "  Router   -> $ROUTER_IMAGE"
          echo "  Scheduler-> $SCHEDULER_IMAGE"
          echo "  Drainer  -> $DRAINER_IMAGE"

      - name: Validate image name format
        shell: bash
        run: |
          check_image() {
            local name="$1"
            local label="$2"
            if [ -z "$name" ]; then
              echo "::error::$label image name resolved to an empty value."
              exit 1
            fi
            if [[ "$name" != */* ]]; then
              echo "::error::$label image '$name' must include a registry namespace (for Docker Hub, use <username>/<repository>)."
              exit 1
            fi
          }
          check_image "$ROUTER_IMAGE" "Router"
          check_image "$SCHEDULER_IMAGE" "Scheduler"
          check_image "$DRAINER_IMAGE" "Drainer"

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Confirm push scope
        shell: bash
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          for image in "$ROUTER_IMAGE" "$SCHEDULER_IMAGE" "$DRAINER_IMAGE"; do
            repo="${image%%:*}"
            echo "Verifying push permissions for $repo"
            if ! docker buildx imagetools inspect "$repo:latest" >/dev/null 2>&1; then
              echo "::warning::Inspect failed for $repo:latest (this is expected if the repository is new or private)."
            fi
          done

  # One job builds every image. The Dockerfile compiles the whole workspace in a
  # single layer before it picks the binary, so after the router image the other
  # three reuse that layer from the builder's local cache and only copy their
  # binary. With one job per image each one compiled the workspace again, at the
  # edge of the runner's memory, and the run kept losing a runner an hour in. The
  # layer cannot be shared between jobs through the registry cache: `COPY . .`
  # includes `.git`, which differs on every checkout.
  images:
    name: Build images (${{ inputs.docker_tag || (github.event_name == 'release' && github.event.release.tag_name) || github.ref_name }})
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: registry_access
    env:
      DOCKER_TAG: ${{ inputs.docker_tag || (github.event_name == 'release' && github.event.release.tag_name) || github.ref_name }}
      VERSION_FEATURE_SET: ${{ inputs.version_feature_set || 'v1' }}
      EXTRA_FEATURES: ${{ inputs.extra_features || '' }}
    steps:
      - name: Resolve image names
        shell: bash
        env:
          INPUT_ROUTER_IMAGE: ${{ inputs.router_image }}
          INPUT_SCHEDULER_IMAGE: ${{ inputs.scheduler_image }}
          INPUT_DRAINER_IMAGE: ${{ inputs.drainer_image }}
          VAR_ROUTER_IMAGE: ${{ vars.ROUTER_IMAGE_NAME }}
          VAR_SCHEDULER_IMAGE: ${{ vars.SCHEDULER_IMAGE_NAME }}
          VAR_DRAINER_IMAGE: ${{ vars.DRAINER_IMAGE_NAME }}
          SHARED_IMAGE: ${{ vars.IMAGE_NAME }}
          NAMESPACE: ${{ inputs.docker_namespace || vars.DOCKER_NAMESPACE || 'lucasdpxsol' }}
        run: |
          resolve_image() {
            local candidate="$1"
            local namespace="$2"
            if [ -n "$candidate" ]; then
              if [[ "$candidate" == */* ]]; then
                printf '%s' "$candidate"
              else
                printf '%s/%s' "$namespace" "$candidate"
              fi
              return 0
            fi
            return 1
          }

          pick_image() {
            local explicit="$1"
            local scoped="$2"
            local shared="$3"
            local default_repo="$4"
            local namespace="$5"
            local value=""

            value=$(resolve_image "$explicit" "$namespace") && { printf '%s' "$value"; return; }
            value=$(resolve_image "$scoped" "$namespace") && { printf '%s' "$value"; return; }
            value=$(resolve_image "$shared" "$namespace") && { printf '%s' "$value"; return; }
            printf '%s/%s' "$namespace" "$default_repo"
          }

          ROUTER_IMAGE=$(pick_image "$INPUT_ROUTER_IMAGE" "$VAR_ROUTER_IMAGE" "$SHARED_IMAGE" "mithras-hyper-router" "$NAMESPACE")
          SCHEDULER_IMAGE=$(pick_image "$INPUT_SCHEDULER_IMAGE" "$VAR_SCHEDULER_IMAGE" "$SHARED_IMAGE" "mithras-hyper-scheduler" "$NAMESPACE")
          DRAINER_IMAGE=$(pick_image "$INPUT_DRAINER_IMAGE" "$VAR_DRAINER_IMAGE" "$SHARED_IMAGE" "mithras-hyper-drainer" "$NAMESPACE")

          {
            printf 'ROUTER_IMAGE=%s\n' "$ROUTER_IMAGE"
            printf 'SCHEDULER_IMAGE=%s\n' "$SCHEDULER_IMAGE"
            printf 'DRAINER_IMAGE=%s\n' "$DRAINER_IMAGE"
            printf 'DOCKER_CACHE_REF=%s\n' "${ROUTER_IMAGE}:buildcache"
          } >> "$GITHUB_ENV"

          echo "Router image    -> $ROUTER_IMAGE"
          echo "Scheduler image -> $SCHEDULER_IMAGE"
          echo "Drainer image   -> $DRAINER_IMAGE"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space and add swap
        # Linking the router crate in release (thin LTO) needs more than the runner's
        # 16 GB of RAM since the upstream sync; without swap rustc dies with
        # "cannot allocate memory" (ResourceExhausted) while compiling `router`.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h / /mnt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The next builds of this job read the compiled workspace from this
          # builder's cache: garbage collection must not evict it in between.
          buildkitd-config-inline: |
            [worker.oci]
              gc = false

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push router image
        id: router
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Pushed by digest only; `publish` tags it once every image built.
          outputs: type=image,name=${{ env.ROUTER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BINARY=router
            VERSION_FEATURE_SET=${{ env.VERSION_FEATURE_SET }}
            EXTRA_FEATURES=${{ env.EXTRA_FEATURES }}
          cache-from: type=registry,ref=${{ env.DOCKER_CACHE_REF }}
          cache-to: type=registry,ref=${{ env.DOCKER_CACHE_REF }},mode=max
          provenance: false

      # From here on the workspace is already compiled: same builder, same build
      # context, so the layer is a local cache hit and each build only copies its
      # binary into the runtime image.
      - name: Build and push scheduler image (consumer)
        id: scheduler_consumer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          outputs: type=image,name=${{ env.SCHEDULER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BINARY=scheduler
            SCHEDULER_FLOW=consumer
            VERSION_FEATURE_SET=${{ env.VERSION_FEATURE_SET }}
            EXTRA_FEATURES=${{ env.EXTRA_FEATURES }}
          provenance: false

      - name: Build and push scheduler image (producer)
        id: scheduler_producer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          outputs: type=image,name=${{ env.SCHEDULER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BINARY=scheduler
            SCHEDULER_FLOW=producer
            VERSION_FEATURE_SET=${{ env.VERSION_FEATURE_SET }}
            EXTRA_FEATURES=${{ env.EXTRA_FEATURES }}
          provenance: false

      - name: Build and push drainer image
        id: drainer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          outputs: type=image,name=${{ env.DRAINER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BINARY=drainer
            VERSION_FEATURE_SET=${{ env.VERSION_FEATURE_SET }}
            EXTRA_FEATURES=${{ env.EXTRA_FEATURES }}
          provenance: false

      # One file per image, a single line `<image>@<digest> <image>:<tag>`, which is
      # what `publish` reads (see EXPECTED_DIGESTS there).
      - name: Record image digests
        shell: bash
        env:
          ROUTER_DIGEST: ${{ steps.router.outputs.digest }}
          SCHEDULER_CONSUMER_DIGEST: ${{ steps.scheduler_consumer.outputs.digest }}
          SCHEDULER_PRODUCER_DIGEST: ${{ steps.scheduler_producer.outputs.digest }}
          DRAINER_DIGEST: ${{ steps.drainer.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          record() { # name, image, digest, tag
            if [ -z "$3" ]; then
              echo "::error::The $1 build reported no digest."
              exit 1
            fi
            printf '%s@%s %s:%s\n' "$2" "$3" "$2" "$4" > "$RUNNER_TEMP/digests/$1"
          }
          record router "$ROUTER_IMAGE" "$ROUTER_DIGEST" "$DOCKER_TAG"
          record scheduler-consumer "$SCHEDULER_IMAGE" "$SCHEDULER_CONSUMER_DIGEST" "$DOCKER_TAG-consumer"
          record scheduler-producer "$SCHEDULER_IMAGE" "$SCHEDULER_PRODUCER_DIGEST" "$DOCKER_TAG-producer"
          record drainer "$DRAINER_IMAGE" "$DRAINER_DIGEST" "$DOCKER_TAG"
          cat "$RUNNER_TEMP/digests"/*

      - name: Upload image digests
        uses: actions/upload-artifact@v4
        with:
          name: digest-images
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          # Long enough to re-run only `publish` after fixing a tagging failure.
          retention-days: 7


  # Tags every image together, and only when all of them built: a failed or
  # cancelled build never moves any tag. `images` uploads one digest file per
  # image, a single line `<image>@<digest> <image>:<tag>`.
  publish:
    name: Publish images (${{ inputs.docker_tag || (github.event_name == 'release' && github.event.release.tag_name) || github.ref_name }})
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: images
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag all images
        shell: bash
        env:
          # router, drainer and one per scheduler flow
          EXPECTED_DIGESTS: "router drainer scheduler-consumer scheduler-producer"
        run: |
          set -euo pipefail
          for name in $EXPECTED_DIGESTS; do
            if [ ! -s "$RUNNER_TEMP/digests/$name" ]; then
              echo "::error::Missing the $name image digest; nothing was tagged."
              exit 1
            fi
          done

          # Every source must exist before the first tag moves.
          for name in $EXPECTED_DIGESTS; do
            read -r source target < "$RUNNER_TEMP/digests/$name"
            docker buildx imagetools inspect "$source" >/dev/null
          done

          # Retried so a transient registry error does not leave some tags moved
          # and others not; a step that still fails says which ones moved.
          for name in $EXPECTED_DIGESTS; do
            read -r source target < "$RUNNER_TEMP/digests/$name"
            for attempt in 1 2 3; do
              if docker buildx imagetools create --prefer-index=false --tag "$target" "$source"; then
                echo "Tagged $source as $target"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Could not tag $target; only the images reported as Tagged above moved. Re-run this job."
                exit 1
              fi
              sleep $((attempt * 20))
            done
          done
